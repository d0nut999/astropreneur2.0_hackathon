version: '3.8'

services:
  backend:
    build: ./backend
    container_name: hireguard_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=dev
      - DATABASE_URL=sqlite:///./data/hireguard.db
      - CORS_ORIGINS=http://localhost:5173
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_API_KEY=
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      - mailpit

  frontend:
    image: node:18-alpine
    container_name: hireguard_frontend
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_USE_MOCK=false

  mailpit:
    image: axllent/mailpit:latest
    container_name: hireguard_mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
      - "1143:1143"  # IMAP
